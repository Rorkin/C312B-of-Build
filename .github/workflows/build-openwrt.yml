name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/mengzonefire/22.03-of
  REPO_BRANCH: openwrt-22.03
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
        sudo docker image prune --all --force
        df -hT

    - name: Checkout
      uses: actions/checkout@main
      with:
        fetch-depth: 0

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/*
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint \
          binutils bison build-essential bzip2 ccache cmake cpio curl \
          device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool \
          lib32gcc-s1 libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
          libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
          libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool \
          lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
          python3 python3-pyelftools python3-setuptools qemu-utils rsync scons \
          squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim \
          wget xmlto xxd zlib1g-dev golang
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Cache
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        prefix: ${{ github.workspace }}/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a 2>&1 || true
        # 验证所有 feed 是否成功
        for feed in packages luci routing passwall_packages passwall2; do
          if [ ! -d "feeds/$feed" ] || [ -z "$(ls -A feeds/$feed 2>/dev/null)" ]; then
            echo "WARNING: feed '$feed' missing, retrying..."
            rm -rf feeds/$feed
            ./scripts/feeds update $feed 2>&1 || true
          fi
        done
        echo "=== Feed directories ==="
        ls -d feeds/*/

    #############################################
    # ★★★ 关键步骤：升级 Go 工具链 ★★★
    # 没有这一步，hysteria/xray-core 全部编译失败
    #############################################
    - name: Upgrade Go toolchain
      run: |
        cd openwrt
        echo "=== Old Go version ==="
        grep 'PKG_VERSION' feeds/packages/lang/golang/golang/Makefile 2>/dev/null | head -3 || echo "Not found"
        
        # 删除旧版 Go (1.19.x)
        rm -rf feeds/packages/lang/golang
        
        # 安装新版 Go (1.22.x+)，支持 Hysteria2/Xray/sing-box 编译
        git clone --depth 1 https://github.com/sbwml/packages_lang_golang \
          -b 23.x feeds/packages/lang/golang
        
        echo "=== New Go version ==="
        grep 'PKG_VERSION' feeds/packages/lang/golang/golang/Makefile | head -3
        grep 'GO_VERSION' feeds/packages/lang/golang/golang/Makefile | head -3

    - name: Remove problematic packages
      run: |
        cd openwrt
        # 只删除确实无法在 22.03 上编译的包
        rm -rf feeds/passwall_packages/geoview       # Go 依赖问题
        rm -rf feeds/passwall_packages/naiveproxy     # 需要 Chromium 构建系统
        rm -rf feeds/passwall_packages/shadow-tls     # Rust 编译器依赖
        
        # ★★★ 不要删除以下包！★★★
        # feeds/passwall_packages/hysteria      ← Hysteria2 核心！保留！
        # feeds/passwall_packages/sing-box       ← 可选保留
        # feeds/passwall_packages/xray-core      ← Xray 核心！保留！
        # feeds/passwall_packages/shadowsocks-rust ← 可选保留
        
        echo "=== Remaining passwall packages ==="
        ls feeds/passwall_packages/

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a 2>&1 || true
        ./scripts/feeds install -a -f 2>&1 || true

    - name: Verify critical packages
      run: |
        cd openwrt
        echo "========== 关键包检查 =========="
        for pkg in luci-app-passwall2 xray-core hysteria chinadns-ng dns2socks \
                   ipt2socks microsocks shadowsocks-libev trojan-plus simple-obfs; do
          found=$(find package feeds -name "Makefile" -path "*/$pkg/*" 2>/dev/null | head -1)
          if [ -n "$found" ]; then
            echo "✅ $pkg: $found"
          else
            echo "❌ $pkg: NOT FOUND"
          fi
        done
        echo ""
        echo "========== Go 工具链检查 =========="
        grep 'PKG_VERSION' feeds/packages/lang/golang/golang/Makefile | head -1

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        echo -e 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y' >> .config
        make defconfig
        echo "========== 最终配置检查 =========="
        echo "--- Passwall2 ---"
        grep -i 'passwall' .config || echo "No passwall config"
        echo "--- Hysteria ---"
        grep -i 'hysteria' .config || echo "No hysteria config"
        echo "--- Go ---"
        grep -i 'golang' .config | head -5 || echo "No golang config"
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) 2>&1 | tee /workdir/build.log || true
        
        if ls bin/targets/ramips/mt7620/*sysupgrade* 1>/dev/null 2>&1; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ Firmware built successfully!"
          # 显示固件大小
          ls -lh bin/targets/ramips/mt7620/*sysupgrade*
        else
          echo "First attempt failed, retrying single thread..."
          make -j1 V=s 2>&1 | tee /workdir/build_v.log || true
          if ls bin/targets/ramips/mt7620/*sysupgrade* 1>/dev/null 2>&1; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "=== Last 200 lines ==="
            tail -200 /workdir/build_v.log
            exit 1
          fi
        fi
        
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@main
      with:
        name: build-log
        path: |
          /workdir/build.log
          /workdir/build_v.log

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        cat > release.txt << 'EOF'
## 极路由3 (HiWiFi R33) OpenWrt 22.03 固件
- 平台: ramips/mt7620 (MT7620A) | 128MB NAND
- 包含: LuCI中文 + PassWall2 + Xray + Hysteria2
- 默认IP: 192.168.10.1
- 默认无密码，请及时设置
EOF
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
