#
# OpenWrt 23.05 Build for HiWiFi R33 (HC5861B / C312B)
# Based on P3TERX/Actions-OpenWrt template
# Adapted for official OpenWrt 23.05 source
#

name: Build OpenWrt 23.05 for HiWiFi R33

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: v23.05.5
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main
      with:
        fetch-depth: 0

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
          libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool libz-dev lrzsz mkisofs msmtp \
          nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools \
          qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip upx-ucl vim wget \
          xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Cache
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        prefix: ${{ github.workspace }}/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        echo -e 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y' >> .config
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Prepare kernel and inject NAND driver
      run: |
        cd openwrt
        # Step 1: 准备内核源码（解压、打patch、复制files/）
        make target/linux/prepare V=s 2>&1 | tail -50
        
        # Step 2: 找到内核源码目录
        KCONFIG_FILE=$(find build_dir -path "*/linux-5.15.*/drivers/mtd/maps/Kconfig" | head -1)
        MAKEFILE_FILE=$(find build_dir -path "*/linux-5.15.*/drivers/mtd/maps/Makefile" | head -1)
        NAND_SOURCE=$(find build_dir -path "*/linux-5.15.*/drivers/mtd/maps/ralink_nand.c" | head -1)
        
        echo "=== NAND Driver Integration ==="
        echo "Kconfig:  $KCONFIG_FILE"
        echo "Makefile: $MAKEFILE_FILE"
        echo "Source:   $NAND_SOURCE"
        
        # Step 3: 验证源文件已通过files/机制复制
        if [ -z "$NAND_SOURCE" ]; then
            echo "ERROR: ralink_nand.c not found in kernel tree!"
            exit 1
        fi
        echo ">>> ralink_nand.c found OK"
        
        # Step 4: 注入Kconfig条目
        if [ -n "$KCONFIG_FILE" ]; then
            if ! grep -q "MTD_NAND_MT7620" "$KCONFIG_FILE"; then
                # 在 endmenu 之前插入新配置项
                sed -i '/^endmenu$/i\config MTD_NAND_MT7620\n\ttristate "Support for NAND on Mediatek MT7620"\n\tdepends on RALINK \&\& SOC_MT7620\n' "$KCONFIG_FILE"
                echo ">>> Kconfig entry injected"
            else
                echo ">>> Kconfig entry already exists"
            fi
            # 验证
            echo "--- Kconfig tail ---"
            tail -10 "$KCONFIG_FILE"
        else
            echo "ERROR: Kconfig not found!"
            exit 1
        fi
        
        # Step 5: 注入Makefile条目
        if [ -n "$MAKEFILE_FILE" ]; then
            if ! grep -q "MTD_NAND_MT7620" "$MAKEFILE_FILE"; then
                printf 'obj-$(CONFIG_MTD_NAND_MT7620)\t+= ralink_nand.o\n' >> "$MAKEFILE_FILE"
                echo ">>> Makefile entry injected"
            else
                echo ">>> Makefile entry already exists"
            fi
            # 验证
            echo "--- Makefile tail ---"
            tail -5 "$MAKEFILE_FILE"
        else
            echo "ERROR: Makefile not found!"
            exit 1
        fi
        
        # Step 6: 强制内核重新配置（使新Kconfig条目生效）
        LINUX_DIR=$(dirname "$KCONFIG_FILE")
        LINUX_DIR=$(dirname "$LINUX_DIR")
        LINUX_DIR=$(dirname "$LINUX_DIR")
        LINUX_DIR=$(dirname "$LINUX_DIR")
        LINUX_DIR=$(dirname "$LINUX_DIR")
        echo "Linux dir: $LINUX_DIR"
        rm -f "$LINUX_DIR/.configured"
        echo ">>> Kernel will be re-configured to pick up MTD_NAND_MT7620"
        
        echo "=== NAND Driver Integration Complete ==="

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        # Only keep hiwifi_r33 firmware files
        mkdir -p /tmp/firmware
        cp -f *hiwifi_r33* /tmp/firmware/ 2>/dev/null || true
        cp -f config.buildinfo /tmp/firmware/ 2>/dev/null || true
        cp -f sha256sums /tmp/firmware/ 2>/dev/null || true
        # List what we have
        echo "=== Firmware files for HiWiFi R33 ==="
        ls -la /tmp/firmware/
        echo "FIRMWARE=/tmp/firmware" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "OpenWrt 23.05.5 for HiWiFi R33 (HC5861B)" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
