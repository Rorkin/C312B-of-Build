name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-23.05
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
        sudo docker image prune --all --force
        df -hT

    - name: Checkout
      uses: actions/checkout@main
      with:
        fetch-depth: 0

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/*
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev golang
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    #=====================================================
    # 【新增关键步骤】从 mengzonefire fork 移植 R33 设备支持
    #=====================================================
    - name: Port Hiwifi R33 device support from 22.03 fork
      run: |
        cd openwrt
        echo "=== Porting Hiwifi R33 device support to OpenWrt 23.05 ==="

        # 1. 克隆 mengzonefire 的 fork（只取设备定义文件）
        git clone --depth 1 https://github.com/mengzonefire/22.03-of -b openwrt-22.03 /tmp/r33-source

        # 2. 查找 R33 DTS 文件
        echo "=== Searching R33 DTS files ==="
        find /tmp/r33-source/target/linux/ramips/dts/ -iname "*r33*" | tee /tmp/r33-dts-list.txt
        # 也查找 hc5661 (R33 的硬件型号名)
        find /tmp/r33-source/target/linux/ramips/dts/ -iname "*hc5661*" | tee -a /tmp/r33-dts-list.txt

        # 3. 复制 DTS 文件到 23.05 源码树
        while IFS= read -r dts_file; do
          if [ -n "$dts_file" ] && [ -f "$dts_file" ]; then
            fname=$(basename "$dts_file")
            echo "Copying DTS: $fname"
            cp "$dts_file" target/linux/ramips/dts/
          fi
        done < /tmp/r33-dts-list.txt

        # 4. 提取 R33 设备定义块并追加到 23.05 的 image Makefile
        echo "=== Extracting R33 device definition from image Makefile ==="
        R33_SRC="/tmp/r33-source/target/linux/ramips/image/mt7620.mk"
        R33_DST="target/linux/ramips/image/mt7620.mk"

        if [ -f "$R33_SRC" ]; then
          # 用 awk 提取 define Device/hiwifi_r33 到 TARGET_DEVICES += hiwifi_r33 的完整块
          awk '
            /^define Device\/hiwifi_r33$/ { found=1 }
            found { print }
            found && /^TARGET_DEVICES \+= hiwifi_r33$/ { found=0; exit }
          ' "$R33_SRC" > /tmp/r33-device-block.txt

          if [ -s /tmp/r33-device-block.txt ]; then
            echo "" >> "$R33_DST"
            echo "# === Hiwifi R33 - ported from mengzonefire/22.03-of ===" >> "$R33_DST"
            cat /tmp/r33-device-block.txt >> "$R33_DST"
            echo "=== R33 device definition successfully added ==="
            cat /tmp/r33-device-block.txt
          else
            echo "WARNING: awk extraction empty, trying alternative patterns..."
            # 尝试其他可能的设备名
            for devname in hiwifi_r33 hiwifi-r33 hiwifi_hc5661-nand hiwifi_r33-nand; do
              awk -v dev="$devname" '
                $0 ~ "^define Device/" dev "$" { found=1 }
                found { print }
                found && $0 ~ "^TARGET_DEVICES \\+= " dev "$" { found=0; exit }
              ' "$R33_SRC" > /tmp/r33-device-block.txt
              if [ -s /tmp/r33-device-block.txt ]; then
                echo "Found device as: $devname"
                echo "" >> "$R33_DST"
                echo "# === Hiwifi R33 ($devname) - ported from mengzonefire/22.03-of ===" >> "$R33_DST"
                cat /tmp/r33-device-block.txt >> "$R33_DST"
                cat /tmp/r33-device-block.txt
                break
              fi
            done
          fi

          # 如果仍未找到，打印所有 hiwifi 相关定义供调试
          if [ ! -s /tmp/r33-device-block.txt ]; then
            echo "=== ALL hiwifi entries in mengzonefire mt7620.mk ==="
            grep -n -i "hiwifi\|r33" "$R33_SRC" || echo "No hiwifi/r33 entries found"
            echo "=== FULL mt7620.mk from mengzonefire ==="
            cat "$R33_SRC"
          fi
        else
          echo "ERROR: mengzonefire mt7620.mk not found at $R33_SRC"
        fi

        # 5. 查找并复制 R33 相关的内核补丁（如果有）
        echo "=== Checking for R33 kernel patches ==="
        # 22.03 用 patches-5.10，23.05 用 patches-5.15
        if [ -d "/tmp/r33-source/target/linux/ramips/patches-5.10/" ]; then
          for patch in $(find /tmp/r33-source/target/linux/ramips/patches-5.10/ -iname "*r33*" -o -iname "*hc5661*" 2>/dev/null); do
            fname=$(basename "$patch")
            echo "Copying patch: $fname (may need manual review for 5.15 compatibility)"
            cp "$patch" target/linux/ramips/patches-5.15/ 2>/dev/null || true
          done
        fi

        # 6. 检查是否有自定义文件（如默认配置等）
        if [ -d "/tmp/r33-source/target/linux/ramips/mt7620/" ]; then
          echo "=== Copying mt7620 subtarget files ==="
          # 不要覆盖已有文件，只补充缺失的
          cp -n /tmp/r33-source/target/linux/ramips/mt7620/* target/linux/ramips/mt7620/ 2>/dev/null || true
        fi

        # 7. 清理临时文件
        rm -rf /tmp/r33-source /tmp/r33-dts-list.txt /tmp/r33-device-block.txt

        # 8. 验证
        echo ""
        echo "========== VERIFICATION =========="
        echo "--- R33 DTS files ---"
        ls -la target/linux/ramips/dts/*r33* target/linux/ramips/dts/*hc5661* 2>/dev/null || echo "WARNING: No R33/HC5661 DTS files found!"
        echo "--- R33 in image Makefile ---"
        grep -c "hiwifi_r33\|hiwifi-r33" target/linux/ramips/image/mt7620.mk && echo "R33 device found in image Makefile" || echo "WARNING: R33 NOT in image Makefile!"
        echo "--- R33 device definition ---"
        grep -A 15 "Device/hiwifi_r33\|Device/hiwifi-r33" target/linux/ramips/image/mt7620.mk || echo "No definition block found"
        echo "========== END VERIFICATION =========="

    - name: Cache
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        prefix: ${{ github.workspace }}/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a 2>&1 || true
        for feed in packages luci routing passwall_packages passwall2; do
          if [ ! -d "feeds/$feed" ] || [ -z "$(ls -A feeds/$feed 2>/dev/null)" ]; then
            echo "WARNING: feed $feed missing, retrying..."
            rm -rf feeds/$feed
            ./scripts/feeds update $feed 2>&1 || true
          fi
        done
        echo "=== Feed directories ==="
        ls -d feeds/*/

    - name: Upgrade Go toolchain
      run: |
        cd openwrt
        echo "=== Old Go version ==="
        grep 'PKG_VERSION' feeds/packages/lang/golang/golang/Makefile 2>/dev/null | head -3 || echo "Not found"

        rm -rf feeds/packages/lang/golang
        git clone --depth 1 https://github.com/sbwml/packages_lang_golang -b 24.x feeds/packages/lang/golang

        echo "=== New Go version ==="
        grep 'PKG_VERSION' feeds/packages/lang/golang/golang/Makefile | head -3

        echo "=== Cleaning cached Go build artifacts ==="
        rm -rf build_dir/hostpkg/go-*
        rm -rf build_dir/host/go-*
        rm -rf staging_dir/hostpkg/bin/go*
        rm -rf staging_dir/host/bin/go*
        rm -rf staging_dir/hostpkg/lib/go/
        rm -rf dl/go-src-*
        rm -rf dl/golang-*
        rm -rf build_dir/target-*/xray-core*
        rm -rf build_dir/target-*/hysteria*
        rm -rf build_dir/target-*/sing-box*
        echo "Go cache cleanup done"

    - name: Remove problematic packages
      run: |
        cd openwrt
        rm -rf feeds/passwall_packages/geoview
        rm -rf feeds/passwall_packages/naiveproxy
        rm -rf feeds/passwall_packages/shadow-tls
        echo "=== Remaining passwall packages ==="
        ls feeds/passwall_packages/

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a 2>&1 || true
        ./scripts/feeds install -a -f 2>&1 || true

    - name: Verify critical packages
      run: |
        cd openwrt
        echo "========== Critical packages check =========="
        for pkg in luci-app-passwall2 xray-core hysteria chinadns-ng dns2socks ipt2socks microsocks shadowsocks-libev trojan-plus simple-obfs; do
          found=$(find package feeds -name "Makefile" -path "*/$pkg/*" 2>/dev/null | head -1)
          if [ -n "$found" ]; then
            echo "OK: $pkg"
            if [ "$pkg" = "xray-core" ] || [ "$pkg" = "hysteria" ]; then
              grep 'PKG_VERSION' "$found" | head -1
            fi
          else
            echo "MISSING: $pkg"
          fi
        done
        echo "========== Go toolchain =========="
        grep 'PKG_VERSION' feeds/packages/lang/golang/golang/Makefile | head -1
        echo "========== R33 device check =========="
        grep "hiwifi_r33\|hiwifi-r33" target/linux/ramips/image/mt7620.mk | head -5 || echo "WARNING: R33 not in image!"

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        echo -e 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y' >> .config
        make defconfig
        echo "=== Device check ==="
        grep 'hiwifi_r33\|DEVICE_hiwifi' .config || echo "WARNING: R33 NOT in final config!"
        echo "=== MULTI_PROFILE check ==="
        grep 'MULTI_PROFILE' .config || echo "No MULTI_PROFILE setting"
        echo "=== Passwall2 config ==="
        grep -i 'passwall' .config | head -5 || echo "No passwall config"
        echo "=== dnsmasq nftset ==="
        grep -i 'nftset' .config || echo "No nftset config"
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) 2>&1 | tee /workdir/build.log || true
        if ls bin/targets/ramips/mt7620/*hiwifi*r33*sysupgrade* 1>/dev/null 2>&1; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "R33 Firmware built successfully!"
          ls -lh bin/targets/ramips/mt7620/*hiwifi*r33*
        elif ls bin/targets/ramips/mt7620/*sysupgrade* 1>/dev/null 2>&1; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "Firmware built (checking for R33):"
          ls -lh bin/targets/ramips/mt7620/*sysupgrade*
        else
          echo "First attempt failed, retrying single thread..."
          make -j1 V=s 2>&1 | tee /workdir/build_v.log || true
          if ls bin/targets/ramips/mt7620/*sysupgrade* 1>/dev/null 2>&1; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "=== What files exist in target dir ==="
            ls -lhR bin/targets/ramips/mt7620/ 2>/dev/null || echo "No target dir"
            echo "=== R33 related build artifacts ==="
            find build_dir/ -iname "*r33*" -o -iname "*hiwifi*" 2>/dev/null | head -20
            echo "=== Last 200 lines ==="
            tail -200 /workdir/build_v.log
            exit 1
          fi
        fi
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Verify built package versions
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt
        echo "========== Built package versions =========="
        echo "--- Xray-core ---"
        find bin/ -name "xray-core*.ipk" 2>/dev/null | head -1
        echo "--- Hysteria ---"
        find bin/ -name "hysteria*.ipk" 2>/dev/null | head -1
        echo "--- PassWall2 ---"
        find bin/ -name "luci-app-passwall2*.ipk" 2>/dev/null | head -1
        echo "--- Firmware files ---"
        ls -lh bin/targets/ramips/mt7620/*r33* 2>/dev/null || echo "No R33-specific files"
        ls -lh bin/targets/ramips/mt7620/*sysupgrade* 2>/dev/null || echo "No sysupgrade files"

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@main
      with:
        name: build-log
        path: |
          /workdir/build.log
          /workdir/build_v.log

    - name: Check space usage
      if: "!cancelled()"
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "Hiwifi R33 OpenWrt 23.05 Firmware" >> release.txt
        echo "Platform: ramips/mt7620 MT7620A 128MB NAND" >> release.txt
        echo "Includes: LuCI Chinese + PassWall2 26.x + Xray 24.x + Hysteria2" >> release.txt
        echo "Default IP: 192.168.10.1" >> release.txt
        echo "Default password: none" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
